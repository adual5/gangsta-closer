<!doctype html>
<!-- Mock of a GitHub Projects board: same data-board-column / data-board-card-id
     markers as the real thing (verified against a live board in run_tests.py). -->
<html>
<head>
<meta charset="utf-8">
<title>Fixture board · GitHub</title>
<style>
  body { font: 14px sans-serif; display: flex; gap: 12px; padding: 12px; }
  [data-board-column] { width: 200px; min-height: 300px; background: #f6f8fa; padding: 8px; }
  [data-board-card-id] { background: #fff; margin: 6px 0; padding: 10px; border: 1px solid #d0d7de; cursor: grab; }
</style>
</head>
<body>
  <script>
    const columns = { 'Todo': [101, 102], 'In Progress': [103], 'Done': [], 'Shipped': [] };
    for (const [name, ids] of Object.entries(columns)) {
      const col = document.createElement('div');
      col.setAttribute('data-board-column', name);
      col.innerHTML = `<h3>${name}</h3>`;
      for (const id of ids) {
        const card = document.createElement('div');
        card.setAttribute('data-board-card-id', id);
        card.id = `c${id}`;
        card.draggable = true;
        card.textContent = `Fixture item ${id}`;
        col.append(card);
      }
      document.body.append(col);
    }
    let dragged = null;
    document.addEventListener('dragstart', (e) => { dragged = e.target.closest('[data-board-card-id]'); e.dataTransfer.setData('text/plain', dragged.id); });
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      const col = e.target.closest('[data-board-column]');
      if (col && dragged) col.append(dragged);
    });
  </script>
</body>
</html>
